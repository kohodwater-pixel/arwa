<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIPPO — franchise invitation card (box clip)</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo.svg" alt="HIPPO Brioche Bread">
  <p class="kicker">امتياز هيبو التجاري</p>
  <div class="band">
    <h1 class="headline"><span>افتح هيبو</span><span>في مدينتك.</span></h1>
  </div>
  <p class="proof"><span>علامة سعودية منذ 2021</span><span>5 فروع في منطقتين</span></p>
  <div class="qr"><img src="assets/qr.svg" alt="QR: https://otlobny.net/HIPPO-franchise-form-final/franchise/index.html"></div>
  <p class="pill"><span>قدّم طلب الامتياز</span></p>
  <div class="strip"></div>
</main>
</body>
</html>
