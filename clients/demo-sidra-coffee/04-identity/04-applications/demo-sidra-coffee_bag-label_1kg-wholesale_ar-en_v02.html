<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Sidra Coffee — 1 kg wholesale bag label 100 x 170 mm v02</title>
<link rel="stylesheet" href="../03-system/brand-v02.css">
<style>
  /* SYSTEM TEST, fictional client. Front label for the 1 kg wholesale bag, trim size 100 x 170 mm.
     Add 3 mm bleed and crop marks for print. No barcode on this face (bar row and barcode stay on different faces).
     The tagline is allowed here because the 1 kg bag is wholesale material. */
  @page { size: 100mm 170mm; margin: 0; }
  body { background: #fff; }
  .label { width: 100mm; height: 170mm; background: var(--ember); color: var(--paper); position: relative; overflow: hidden;
           display: flex; flex-direction: column; }
  .pad { padding: 0 7mm; }
  .top { padding-top: 8mm; display: flex; justify-content: flex-end; direction: ltr; }
  .top img { width: 36mm; display: block; }
  .hair { height: 0.5mm; background: var(--ink); margin: 6mm 7mm 0; }
  .figure { display: flex; justify-content: space-between; align-items: baseline; direction: ltr; margin-top: 2mm; }
  .figure .f-en { font: 300 50pt/1 var(--fig); }
  .figure .f-ar { font: 700 60pt/1.2 var(--ar); direction: rtl; }
  .net { display: flex; justify-content: space-between; direction: ltr; margin-top: 0; }
  .net .n-ar { font: 600 10pt/1.5 var(--ar); direction: rtl; }
  .net .n-en { font: 600 8.6pt/1.3 var(--en); align-self: center; }
  .band { height: 26mm; margin-top: 6mm; }
  .band.bars { column-gap: calc(100% / 41); }
  .band.bars i { background: var(--ink); }
  .band.bars i:nth-child(4) { background: var(--paper); }
  .panel { background: var(--crema); color: var(--ink); margin: 6mm 7mm 0; padding: 3mm 4mm; height: 18mm;
           display: flex; justify-content: space-between; direction: ltr; }
  .panel .p-ar { font: 600 9pt/1.5 var(--ar); direction: rtl; }
  .panel .p-en { font: 600 6.5pt/1.4 var(--en); letter-spacing: 0.12em; text-transform: uppercase; padding-top: 1mm; }
  .facts { display: flex; justify-content: space-between; gap: 4mm; direction: ltr; margin-top: 5mm; }
  .facts .ar { flex: 0 0 41mm; }
  .facts .en { flex: 0 0 41mm; }
  .facts .ar .l1 { font: 500 9.4pt/1.5 var(--ar); }
  .facts .ar .l2 { font: 400 9.4pt/1.7 var(--ar); }
  .facts .en .l1 { font: 500 8pt/1.3 var(--en); }
  .facts .en .l2 { font: 400 8pt/1.45 var(--en); margin-top: 0.6mm; }
  .foot { margin-top: auto; padding-bottom: 6mm; display: flex; justify-content: space-between; align-items: flex-end; direction: ltr; }
  .foot .ar { font: 400 7.4pt/1.6 var(--ar); }
  .foot .en { font: 400 6.5pt/1.45 var(--en); }
  @media screen { body { background: #8c8782; padding: 6mm; width: 112mm; } }
</style>
</head>
<body>
  <section class="label">
    <div class="top pad"><img src="../02-logo/demo-sidra-coffee_logo_bilingual-colour-on-ember_ar-en_v01.svg" alt="سدرة — Sidra Coffee"></div>
    <div class="hair"></div>
    <div class="figure pad">
      <div class="f-en">1 kg</div>
      <div class="f-ar">1 كغ</div>
    </div>
    <div class="net pad">
      <div class="n-en">Net weight 1 kg</div>
      <div class="n-ar">الوزن الصافي 1 كغ</div>
    </div>
    <div class="band bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="panel">
      <div class="p-en">Coffee</div>
      <div class="p-ar">القهوة</div>
    </div>
    <div class="facts pad">
      <div class="en">
        <div class="l1">Roasted specialty coffee beans</div>
        <div class="l2">Roasted for your order.<br>Every week.</div>
      </div>
      <div class="ar">
        <div class="l1">حبوب قهوة مختصة محمّصة</div>
        <div class="l2">«تُحمَّص لطلبك، كل أسبوع.»</div>
      </div>
    </div>
    <div class="foot pad">
      <div class="en">Sidra Coffee Company<br>Riyadh, Saudi Arabia<br>hello@sidra-coffee.example</div>
      <div class="ar">شركة سدرة للقهوة<br>الرياض، المملكة العربية السعودية</div>
    </div>
  </section>
</body>
</html>
