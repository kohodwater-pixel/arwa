<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Sidra Coffee — business card 90 x 50 mm (AR side, EN side) v02</title>
<link rel="stylesheet" href="../03-system/brand-v02.css">
<style>
  /* SYSTEM TEST, fictional client. Trim size only: add 3 mm bleed and crop marks for print.
     Company card: no personal name or job title, because no team names have been supplied.
     v02: phone number removed until the client supplies it; email is the only contact channel. */
  @page { size: 90mm 50mm; margin: 0; }
  body { background: #fff; }
  .card { width: 90mm; height: 50mm; position: relative; overflow: hidden; page-break-after: always;
          padding: 5.5mm 6mm; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: calc(78mm / 41);
          grid-template-rows: auto 1fr auto; }
  .card.ar-side { background: var(--paper); direction: rtl; }
  .card.en-side { background: var(--crema); direction: ltr; }
  .logo { grid-column: 1 / span 4; grid-row: 1; }
  .ar-side .logo img { width: 25mm; display: block; }
  .en-side .logo img { width: 38mm; display: block; }
  .what { grid-column: 1 / span 4; grid-row: 3; align-self: end; }
  .contact { grid-column: 5 / span 3; grid-row: 3; align-self: end; direction: ltr; }
  .ar-side .contact { text-align: left; }
  .en-side .contact { text-align: right; justify-self: end; }
  .ar-side .what .l1 { font: 500 9.2pt/1.5 var(--ar); }
  .ar-side .what .l2 { font: 400 7.6pt/1.6 var(--ar); }
  .en-side .what .l1 { font: 500 8pt/1.3 var(--en); }
  .en-side .what .l2 { font: 400 6.6pt/1.45 var(--en); }
  .contact .mail { font: 400 6.6pt/1.45 var(--en); }
  @media screen { body { background: #8c8782; padding: 6mm; display: flex; flex-direction: column; gap: 6mm; align-items: flex-start; width: 102mm; } }
</style>
</head>
<body>
  <!-- AR side (front) -->
  <section class="card ar-side" lang="ar">
    <div class="logo"><img src="../02-logo/demo-sidra-coffee_logo_primary-colour_ar_v01.svg" alt="سدرة"></div>
    <div class="what ar">
      <div class="l1">محمصة قهوة مختصة</div>
      <div class="l2">الرياض، المملكة العربية السعودية</div>
    </div>
    <div class="contact">
      <div class="mail">hello@sidra-coffee.example</div>
    </div>
  </section>
  <!-- EN side (back) -->
  <section class="card en-side" lang="en">
    <div class="logo"><img src="../02-logo/demo-sidra-coffee_logo_latin-colour_en_v01.svg" alt="Sidra Coffee"></div>
    <div class="what en">
      <div class="l1">Specialty coffee roastery</div>
      <div class="l2">Riyadh, Saudi Arabia</div>
    </div>
    <div class="contact">
      <div class="mail">hello@sidra-coffee.example</div>
    </div>
  </section>
</body>
</html>
