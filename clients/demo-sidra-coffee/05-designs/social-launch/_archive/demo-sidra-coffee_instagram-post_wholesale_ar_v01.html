<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sidra Coffee — Instagram feed post, wholesale, AR, v01 (SYSTEM TEST, fictional client)</title>
<!-- 1080 x 1350 px. Seven-column grid: margin 80, content 920, column 112.2, gutter 22.4 (1/5 column).
     Tokens and @font-face come from the shared brand CSS (IBM Plex Sans Arabic from assets/fonts). -->
<link rel="stylesheet" href="../../04-identity/03-system/brand.css">
<style>
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--paper); position: relative; }
  .post { position: absolute; inset: 0; }

  /* logo: primary Arabic lockup, top right, clear space >= 0.27 W kept free */
  .logo { position: absolute; top: 80px; right: 80px; width: 168px; height: auto; display: block; }

  /* display headline: the approved wholesale tagline, with diacritics */
  .headline { position: absolute; top: 262px; right: 80px; left: 80px;
    font-weight: 700; font-size: 132px; line-height: 1.3; color: var(--ink); white-space: nowrap; }

  .rule { position: absolute; top: 640px; right: 80px; left: 80px; height: 2px; background: var(--ink); }

  /* text block: 4 columns from the right = 516 px */
  .text { position: absolute; top: 672px; right: 80px; width: 516px; }
  .sub { font-weight: 500; font-size: 42px; line-height: 1.5; color: var(--ink); }
  .cta { position: absolute; top: 698px; left: 80px; width: 381px; /* 3 columns from the left */
    font-weight: 400; font-size: 27px; line-height: 1.75; color: var(--ink); }

  /* Crema ground with the seven-bar band, fourth bar lit; bars run off the bottom edge */
  .ground { position: absolute; top: 880px; right: 0; left: 0; bottom: 0; background: var(--crema); }
  .bars { position: absolute; top: 944px; left: 80px; width: 920px; height: 406px; }
</style>
</head>
<body>
<div class="post ar">
  <img class="logo" src="../../04-identity/02-logo/demo-sidra-coffee_logo_primary-colour_ar_v01.svg" alt="سدرة">
  <h1 class="headline">تُحمَّص لطلبك،<br>كل أسبوع.</h1>
  <div class="rule"></div>
  <div class="text">
    <p class="sub">محمصة من الرياض،<br>لمقاهي الرياض.</p>
  </div>
  <p class="cta">لطلبات المقاهي بالجملة،<br>راسلنا على الخاص.</p>
  <div class="ground"></div>
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
</body>
</html>
