[package]
name = "studio-core"
description = "Cinematic Studio core: projects, storage, ComfyUI client, GPU manager, FFmpeg timeline. No UI and no Tauri dependency, so it is tested on any OS."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "studio_core"

[[bin]]
name = "dev-bridge"
path = "src/bin/dev_bridge.rs"
required-features = ["dev-bridge"]

[features]
default = []
# HTTP bridge used only during development and browser tests. Never built into the installer.
dev-bridge = ["dep:tiny_http"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = { version = "0.12", optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
