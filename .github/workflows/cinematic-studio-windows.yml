name: Cinematic Studio (Windows build and install test)

on:
  workflow_dispatch:
  push:
    branches: ['claude/figma-plugin-install-r7pwfk', 'main']
    paths: ['cinematic-studio/**', '.github/workflows/cinematic-studio-windows.yml']

permissions:
  contents: read

concurrency:
  group: cinematic-studio-${{ github.ref }}
  cancel-in-progress: true

env:
  # FFmpeg is run as a separate program. One pinned release, checked against a pinned checksum.
  FFMPEG_VERSION: '7.1.1'
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip
  # SHA-256 of that archive, computed on 2026-11-21. The build stops if the download differs.
  FFMPEG_SHA256: 04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cinematic-studio
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinematic-studio/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cinematic-studio

      - name: Fetch FFmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest $env:FFMPEG_URL -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg checksum mismatch: got $hash" }
          "FFmpeg archive SHA-256 verified: $hash"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          Copy-Item "$root\bin\ffmpeg.exe", "$root\bin\ffprobe.exe" src-tauri\resources\ffmpeg\
          Copy-Item "$root\LICENSE" src-tauri\resources\ffmpeg\FFMPEG-LICENSE.txt
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$root\bin\ffmpeg.exe" -version | Select-Object -First 1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Director engine tests
        run: npm test

      - name: Core tests (Rust, on Windows)
        run: cargo test -p studio-core

      - name: Build the installer (NSIS)
        run: npx tauri build

      - name: Locate the installer
        id: pkg
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS installer was produced' }
          "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB, SHA-256 $((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)"
          "path=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install, launch, restart and uninstall
        run: ./tests/windows-install-test.ps1 -Installer "${{ steps.pkg.outputs.path }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-studio-windows-installer
          path: cinematic-studio/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14
